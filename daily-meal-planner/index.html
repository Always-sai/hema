<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Meal Planner</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --primary-green: #2E7D32;
            --primary-green-light: #4CAF50;
            --primary-green-dark: #1B5E20;
            --accent-cream: #FFF8F0;
            --text-dark: #2C1810;
            --text-medium: #5D4037;
            --text-light: #8D6E63;
            --border-light: #E0D6C8;
            --shadow-light: 0 2px 8px rgba(0, 0, 0, 0.05);
            --shadow-medium: 0 4px 16px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 8px 24px rgba(46, 125, 50, 0.15);
            --gradient-card: linear-gradient(135deg, #FFFFFF 0%, #F9F6F0 100%);
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: var(--text-dark);
            background: var(--accent-cream);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Typography */
        h1, h2, h3, h4, h5, h6 {
            font-weight: 600;
            line-height: 1.2;
            color: var(--text-dark);
            letter-spacing: -0.02em;
        }

        .hero-title {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-green-dark) 0%, var(--primary-green) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section-title {
            font-size: clamp(1.5rem, 3vw, 2.25rem);
            font-weight: 600;
            color: var(--text-dark);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .body-text {
            font-size: 1rem;
            color: var(--text-medium);
            line-height: 1.7;
        }

        .small-text {
            font-size: 0.875rem;
            color: var(--text-light);
        }

        /* Layout */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .section {
            padding: 4rem 0;
        }

        /* Header */
        header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-light);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 0;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-green);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-medium);
            font-weight: 500;
            transition: var(--transition-smooth);
            position: relative;
        }

        .nav-links a:hover {
            color: var(--primary-green);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary-green);
            transition: var(--transition-smooth);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .mobile-menu-toggle {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
        }

        .hamburger {
            width: 24px;
            height: 2px;
            background: var(--text-dark);
            position: relative;
            transition: var(--transition-smooth);
        }

        .hamburger::before, .hamburger::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 2px;
            background: var(--text-dark);
            transition: var(--transition-smooth);
        }

        .hamburger::before {
            top: -6px;
        }

        .hamburger::after {
            bottom: -6px;
        }

        .mobile-menu-toggle.active .hamburger {
            background: transparent;
        }

        .mobile-menu-toggle.active .hamburger::before {
            transform: rotate(45deg);
            top: 0;
        }

        .mobile-menu-toggle.active .hamburger::after {
            transform: rotate(-45deg);
            bottom: 0;
        }

        /* Hero Section */
        .hero {
            padding: 6rem 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.8) 0%, rgba(249, 246, 240, 0.8) 100%);
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(46, 125, 50, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        .hero-description {
            font-size: 1.25rem;
            color: var(--text-medium);
            margin: 1.5rem 0 2.5rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .cta-button {
            background: var(--primary-green);
            color: white;
            border: none;
            padding: 1rem 2.5rem;
            font-size: 1.125rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: var(--shadow-light);
            position: relative;
            overflow: hidden;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: var(--transition-smooth);
        }

        .cta-button:hover::before {
            left: 100%;
        }

        .cta-button:hover {
            background: var(--primary-green-light);
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .cta-button:active {
            transform: translateY(0);
        }

        /* Filters Section */
        .filters-section {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 3rem;
            box-shadow: var(--shadow-light);
            border: 1px solid var(--border-light);
        }

        .filters-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .filters-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .filter-buttons {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .filter-button {
            background: var(--accent-cream);
            border: 1px solid var(--border-light);
            padding: 0.5rem 1.25rem;
            border-radius: 24px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-medium);
            transition: var(--transition-smooth);
        }

        .filter-button:hover {
            background: var(--primary-green);
            color: white;
            border-color: var(--primary-green);
            transform: translateY(-1px);
        }

        .filter-button.active {
            background: var(--primary-green);
            color: white;
            border-color: var(--primary-green);
        }

        /* Meal Grid */
        .meals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .meal-card {
            background: var(--gradient-card);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-light);
            border: 1px solid var(--border-light);
            transition: var(--transition-smooth);
            position: relative;
        }

        .meal-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .meal-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: linear-gradient(135deg, var(--primary-green-light), var(--primary-green-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            font-weight: 600;
        }

        .meal-content {
            padding: 1.5rem;
        }

        .meal-category {
            display: inline-block;
            background: rgba(46, 125, 50, 0.1);
            color: var(--primary-green);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.75rem;
        }

        .meal-title {
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .meal-description {
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .meal-ingredients {
            margin-bottom: 1.5rem;
        }

        .ingredients-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .ingredients-list {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .ingredient-item {
            background: white;
            border: 1px solid var(--border-light);
            padding: 0.25rem 0.75rem;
            border-radius: 16px;
            font-size: 0.75rem;
            color: var(--text-medium);
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .ingredient-item:hover {
            background: var(--primary-green);
            color: white;
            border-color: var(--primary-green);
        }

        .ingredient-item.checked {
            background: var(--primary-green);
            color: white;
            border-color: var(--primary-green);
            text-decoration: line-through;
            opacity: 0.7;
        }

        .ingredient-checkbox {
            width: 16px;
            height: 16px;
            border: 2px solid var(--border-light);
            border-radius: 3px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
        }

        .ingredient-item.checked .ingredient-checkbox {
            background: white;
            border-color: white;
        }

        .ingredient-item.checked .ingredient-checkbox::after {
            content: '✓';
            color: var(--primary-green);
            font-size: 0.75rem;
            font-weight: 600;
        }

        .meal-actions {
            display: flex;
            gap: 0.75rem;
        }

        .action-button {
            flex: 1;
            background: white;
            border: 1px solid var(--border-light);
            padding: 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-medium);
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .action-button:hover {
            background: var(--primary-green);
            color: white;
            border-color: var(--primary-green);
        }

        .action-button.completed {
            background: var(--primary-green);
            color: white;
            border-color: var(--primary-green);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: white;
            border-radius: 16px;
            box-shadow: var(--shadow-light);
            border: 1px solid var(--border-light);
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            opacity: 0.5;
        }

        .empty-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--text-dark);
        }

        .empty-description {
            color: var(--text-medium);
            max-width: 400px;
            margin: 0 auto 2rem;
        }

        /* Ingredient Checklist */
        .ingredient-checklist {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: var(--shadow-light);
            border: 1px solid var(--border-light);
            margin-top: 2rem;
        }

        .checklist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .checklist-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .clear-all-button {
            background: var(--accent-cream);
            border: 1px solid var(--border-light);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.875rem;
            color: var(--text-medium);
            transition: var(--transition-smooth);
        }

        .clear-all-button:hover {
            background: #ffebee;
            border-color: #ffcdd2;
            color: #c62828;
        }

        .checklist-items {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 0.75rem;
        }

        .checklist-item {
            background: var(--accent-cream);
            border: 1px solid var(--border-light);
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.875rem;
            color: var(--text-medium);
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .checklist-item:hover {
            background: var(--primary-green);
            color: white;
            border-color: var(--primary-green);
            transform: translateX(4px);
        }

        .checklist-item.checked {
            background: var(--primary-green);
            color: white;
            border-color: var(--primary-green);
            text-decoration: line-through;
            opacity: 0.7;
        }

        .checklist-checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid var(--border-light);
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
            flex-shrink: 0;
        }

        .checklist-item.checked .checklist-checkbox {
            background: white;
            border-color: white;
        }

        .checklist-item.checked .checklist-checkbox::after {
            content: '✓';
            color: var(--primary-green);
            font-size: 0.875rem;
            font-weight: 600;
        }

        /* Footer */
        footer {
            background: white;
            border-top: 1px solid var(--border-light);
            padding: 3rem 0 2rem;
            margin-top: 4rem;
        }

        .footer-content {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 3rem;
            margin-bottom: 2rem;
        }

        .footer-brand {
            max-width: 300px;
        }

        .footer-logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-green);
            text-decoration: none;
            display: inline-block;
            margin-bottom: 1rem;
        }

        .footer-description {
            color: var(--text-medium);
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .footer-social {
            display: flex;
            gap: 1rem;
        }

        .social-link {
            width: 36px;
            height: 36px;
            background: var(--accent-cream);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-green);
            text-decoration: none;
            transition: var(--transition-smooth);
        }

        .social-link:hover {
            background: var(--primary-green);
            color: white;
            transform: translateY(-2px);
        }

        .footer-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 1rem;
        }

        .footer-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .footer-links a {
            color: var(--text-medium);
            text-decoration: none;
            transition: var(--transition-smooth);
        }

        .footer-links a:hover {
            color: var(--primary-green);
            padding-left: 4px;
        }

        .footer-bottom {
            border-top: 1px solid var(--border-light);
            padding-top: 2rem;
            text-align: center;
            color: var(--text-light);
            font-size: 0.875rem;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .meal-card {
            animation: fadeIn 0.5s ease-out;
        }

        /* Focus States */
        *:focus {
            outline: 2px solid var(--primary-green);
            outline-offset: 2px;
        }

        /* Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Responsive Design */
        @media (max-width: 968px) {
            .footer-content {
                grid-template-columns: 1fr 1fr;
                gap: 2rem;
            }
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: white;
                border-bottom: 1px solid var(--border-light);
                padding: 1rem;
                box-shadow: var(--shadow-medium);
            }

            .nav-links.active {
                display: flex;
                flex-direction: column;
                gap: 1rem;
            }

            .mobile-menu-toggle {
                display: block;
            }

            .hero {
                padding: 4rem 0;
            }

            .filters-section {
                padding: 1.5rem;
            }

            .filter-buttons {
                justify-content: center;
            }

            .meals-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 1.5rem;
            }

            .footer-content {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 2rem;
            }

            .footer-brand {
                max-width: 100%;
            }

            .footer-social {
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 0 1rem;
            }

            .section {
                padding: 3rem 0;
            }

            .hero-title {
                font-size: 2rem;
            }

            .hero-description {
                font-size: 1.125rem;
            }

            .cta-button {
                width: 100%;
                padding: 0.875rem 2rem;
            }

            .meals-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .meal-actions {
                flex-direction: column;
            }

            .checklist-items {
                grid-template-columns: 1fr;
            }
        }

        /* Utility Classes */
        .hidden {
            display: none !important;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: white;
            border-radius: 8px;
            padding: 1rem 1.5rem;
            box-shadow: var(--shadow-medium);
            border: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transform: translateX(400px);
            transition: var(--transition-smooth);
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast-success {
            border-left: 4px solid var(--primary-green);
        }

        .toast-icon {
            color: var(--primary-green);
            font-size: 1.25rem;
        }

        /* Loading State */
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Error Message */
        .error-message {
            background: #ffebee;
            border: 1px solid #ffcdd2;
            color: #c62828;
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .error-icon {
            font-size: 1.25rem;
        }
    </style>

            {
                id: 6,
                title: "Vegetable Stir-Fry",
                category: "Lunch",
                description: "Quick and healthy stir-fry with bell peppers, broccoli, carrots, and snap peas in a soy-ginger sauce.",
                ingredients: ["Bell peppers", "Broccoli", "Carrots", "Snap peas", "Soy sauce", "Ginger", "Garlic", "Olive oil"],
                image: "🥦"
            },
            {
                id: 7,
                title: "Beef and Broccoli",
                category: "Dinner",
                description: "Tender beef strips cooked with fresh broccoli in a rich brown sauce.",
                ingredients: ["Beef strips", "Fresh broccoli", "Soy sauce", "Garlic", "Cornstarch", "Vegetable oil"],
                image: "🥩"
            },
            {
                id: 8,
                title: "Apple Cinnamon Oatmeal",
                category: "Breakfast",
                description: "Warm oatmeal cooked with apples, cinnamon, and a hint of maple syrup.",
                ingredients: ["Oats", "Apples", "Cinnamon", "Maple syrup", "Walnuts", "Milk"],
                image: "🍎"
            }
        ];

        // Main App Component
        function MealPlannerApp() {
            const [meals, setMeals] = useState(sampleMeals);
            const [filteredMeals, setFilteredMeals] = useState(sampleMeals);
            const [selectedCategory, setSelectedCategory] = useState('All');
            const [ingredientChecklist, setIngredientChecklist] = useState([]);
            const [completedIngredients, setCompletedIngredients] = useState([]);
            const [completedMeals, setCompletedMeals] = useState([]);
            const [toastMessage, setToastMessage] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState(null);

            // Get all unique categories
            const categories = ['All', ...Array.from(new Set(meals.map(meal => meal.category)))];

            // Filter meals based on selected category
            useEffect(() => {
                if (selectedCategory === 'All') {
                    setFilteredMeals(meals);
                } else {
                    setFilteredMeals(meals.filter(meal => meal.category === selectedCategory));
                }
            }, [selectedCategory, meals]);

            // Collect all ingredients from all meals
            useEffect(() => {
                const allIngredients = meals.flatMap(meal => meal.ingredients);
                const uniqueIngredients = [...new Set(allIngredients)];
                setIngredientChecklist(uniqueIngredients);
            }, [meals]);

            // Toast notification function
            const showToast = (message) => {
                setToastMessage(message);
                setTimeout(() => {
                    setToastMessage('');
                }, 3000);
            };

            // Filter button click handler
            const handleFilterClick = (category) => {
                setSelectedCategory(category);
                showToast(`Showing ${category} meals`);
            };

            // Ingredient checkbox click handler
            const handleIngredientClick = (ingredient) => {
                if (completedIngredients.includes(ingredient)) {
                    setCompletedIngredients(completedIngredients.filter(item => item !== ingredient));
                    showToast(`Removed ${ingredient} from checklist`);
                } else {
                    setCompletedIngredients([...completedIngredients, ingredient]);
                    showToast(`Added ${ingredient} to checklist`);
                }
            };

            // Meal action button click handler
            const handleMealAction = (mealId, action) => {
                if (action === 'complete') {
                    if (completedMeals.includes(mealId)) {
                        setCompletedMeals(completedMeals.filter(id => id !== mealId));
                        showToast(`Marked ${meals.find(m => m.id === mealId).title} as incomplete`);
                    } else {
                        setCompletedMeals([...completedMeals, mealId]);
                        showToast(`Completed ${meals.find(m => m.id === mealId).title}`);
                    }
                } else if (action === 'ingredients') {
                    // Toggle all ingredients of this meal
                    const meal = meals.find(m => m.id === mealId);
                    const mealIngredients = meal.ingredients;
                    const newCompletedIngredients = [...completedIngredients];
                    
                    mealIngredients.forEach(ingredient => {
                        if (!newCompletedIngredients.includes(ingredient)) {
                            newCompletedIngredients.push(ingredient);
                        }
                    });
                    
                    setCompletedIngredients(newCompletedIngredients);
                    showToast(`Added all ingredients for ${meal.title} to checklist`);
                }
            };

            // Clear all ingredients handler
            const handleClearAllIngredients = () => {
                if (completedIngredients.length > 0) {
                    setCompletedIngredients([]);
                    showToast('Cleared all ingredients from checklist');
                }
            };

            // Simulate loading state
            const simulateLoading = () => {
                setIsLoading(true);
                setTimeout(() => {
                    setIsLoading(false);
                }, 1000);
            };

            return (
                <div>
                    {/* Header */}
                    <header>
                        <div className="container">
                            <nav>
                                <a href="#" className="logo">
                                    <span>🍽️</span>
                                    <span>Daily Meal Planner</span>
                                </a>
                                <ul className="nav-links" id="navLinks">
                                    <li><a href="#hero">Home</a></li>
                                    <li><a href="#meals">Meals</a></li>
                                    <li><a href="#ingredients">Ingredients</a></li>
                                    <li><a href="#about">About</a></li>
                                </ul>
                                <button 
                                    className="mobile-menu-toggle" 
                                    id="mobileMenuToggle"
                                    aria-label="Toggle navigation menu"
                                >
                                    <div className="hamburger"></div>
                                </button>
                            </nav>
                        </div>
                    </header>

                    {/* Hero Section */}
                    <section className="hero" id="hero">
                        <div className="container">
                            <div className="hero-content">
                                <h1 className="hero-title">Plan Your Perfect Day</h1>
                                <p className="hero-description">
                                    Discover delicious meals, manage your ingredients, and track your progress with our friendly meal planner. 
                                    Make every day healthier and more enjoyable!
                                </p>
                                <button 
                                    className="cta-button" 
                                    onClick={() => {
                                        document.getElementById('meals').scrollIntoView({ behavior: 'smooth' });
                                        simulateLoading();
                                    }}
                                >
                                    {isLoading ? <span className="loading"></span> : 'Explore Meals'}
                                </button>
                            </div>
                        </div>
                    </section>

                    {/* Main Content */}
                    <main className="section" id="meals">
                        <div className="container">
                            {/* Filters Section */}
                            <div className="filters-section">
                                <div className="filters-header">
                                    <h2 className="filters-title">Browse Meals</h2>
                                    <div className="filter-buttons">
                                        {categories.map(category => (
                                            <button
                                                key={category}
                                                className={`filter-button ${selectedCategory === category ? 'active' : ''}`}
                                                onClick={() => handleFilterClick(category)}
                                                aria-label={`Filter by ${category}`}
                                            >
                                                {category}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            {/* Error Message */}
                            {error && (
                                <div className="error-message">
                                    <span className="error-icon">⚠️</span>
                                    <span>{error}</span>
                                </div>
                            )}

                            {/* Meals Grid */}
                            {filteredMeals.length > 0 ? (
                                <div className="meals-grid">
                                    {filteredMeals.map(meal => (
                                        <article key={meal.id} className="meal-card">
                                            <div className="meal-image">{meal.image}</div>
                                            <div className="meal-content">
                                                <span className="meal-category">{meal.category}</span>
                                                <h3 className="card-title meal-title">{meal.title}</h3>
                                                <p className="body-text meal-description">{meal.description}</p>
                                                
                                                <div className="meal-ingredients">
                                                    <h4 className="ingredients-title">
                                                        <span>📝</span>
                                                        Key Ingredients
                                                    </h4>
                                                    <ul className="ingredients-list">
                                                        {meal.ingredients.slice(0, 4).map((ingredient, index) => (
                                                            <li 
                                                                key={index}
                                                                className={`ingredient-item ${completedIngredients.includes(ingredient) ? 'checked' : ''}`}
                                                                onClick={() => handleIngredientClick(ingredient)}
                                                                title="Click to toggle"
                                                            >
                                                                <div className="ingredient-checkbox"></div>
                                                                <span>{ingredient}</span>
                                                            </li>
                                                        ))}
                                                        {meal.ingredients.length > 4 && (
                                                            <li className="small-text" style={{ alignSelf: 'center', padding: '0.25rem 0.75rem' }}>
                                                                +{meal.ingredients.length - 4} more
                                                            </li>
                                                        )}
                                                    </ul>
                                                </div>

                                                <div className="meal-actions">
                                                    <button 
                                                        className={`action-button ${completedMeals.includes(meal.id) ? 'completed' : ''}`}
                                                        onClick={() => handleMealAction(meal.id, 'complete')}
                                                        aria-label={`${completedMeals.includes(meal.id) ? 'Mark as incomplete' : 'Mark as complete'} ${meal.title}`}
                                                    >
                                                        <span>{completedMeals.includes(meal.id) ? '✓ Completed' : '○ Complete'}</span>
                                                    </button>
                                                    <button 
                                                        className="action-button"
                                                        onClick={() => handleMealAction(meal.id, 'ingredients')}
                                                        aria-label={`Add all ingredients for ${meal.title}`}
                                                    >
                                                        <span>➕ Add All Ingredients</span>
                                                    </button>
                                                </div>
                                            </div>
                                        </article>
                                    ))}
                                </div>
                            ) : (
                                <div className="empty-state">
                                    <div className="empty-icon">🔍</div>
                                    <h3 className="empty-title">No meals found</h3>
                                    <p className="empty-description">
                                        We couldn't find any meals in the "{selectedCategory}" category. 
                                        Try selecting a different category or check back later for new additions.
                                    </p>
                                    <button 
                                        className="cta-button"
                                        onClick={() => handleFilterClick('All')}
                                    >
                                        View All Meals
                                    </button>
                                </div>
                            )}

                            {/* Ingredient Checklist */}
                            <section className="ingredient-checklist" id="ingredients">
                                <div className="checklist-header">
                                    <h2 className="checklist-title">
                                        <span>🛒</span>
                                        Shopping Checklist ({completedIngredients.length}/{ingredientChecklist.length})
                                    </h2>
                                    {completedIngredients.length > 0 && (
                                        <button 
                                            className="clear-all-button"
                                            onClick={handleClearAllIngredients}
                                            aria-label="Clear all ingredients from checklist"
                                        >
                                            Clear All
                                        </button>
                                    )}
                                </div>
                                
                                {ingredientChecklist.length > 0 ? (
                                    <div className="checklist-items">
                                        {ingredientChecklist.map((ingredient, index) => (
                                            <div 
                                                key={index}
                                                className={`checklist-item ${completedIngredients.includes(ingredient) ? 'checked' : ''}`}
                                                onClick={() => handleIngredientClick(ingredient)}
                                                title="Click to toggle"
                                            >
                                                <div className="checklist-checkbox"></div>
                                                <span>{ingredient}</span>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="empty-state" style={{ padding: '2rem', marginTop: '0' }}>
                                        <div className="empty-icon">📋</div>
                                        <p className="empty-description">
                                            Your shopping checklist is empty. Start adding ingredients from the meals above!
                                        </p>
                                    </div>
                                )}
                            </section>
                        </div>
                    </main>

                    {/* About Section */}
                    <section className="section" id="about">
                        <div className="container">
                            <div style={{ maxWidth: '800px', margin: '0 auto', textAlign: 'center' }}>
                                <h2 className="section-title">Why Choose Daily Meal Planner?</h2>
                                <p className="body-text" style={{ margin: '1.5rem 0' }}>
                                    Our meal planner is designed to make healthy eating effortless and enjoyable. 
                                    With carefully curated meal cards, easy ingredient tracking, and simple filtering options, 
                                    you'll never wonder what's for dinner again.
                                </p>
                                
                                <div style={{ 
                                    display: 'grid', 
                                    gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', 
                                    gap: '2rem', 
                                    marginTop: '3rem' 
                                }}>
                                    <div>
                                        <div style={{ fontSize: '2.5rem', marginBottom: '1rem' }}>🍽️</div>
                                        <h3 className="card-title" style={{ fontSize: '1.25rem', marginBottom: '0.5rem' }}>Delicious Recipes</h3>
                                        <p className="small-text" style={{ color: 'var(--text-medium)' }}>
                                            Curated meals from breakfast to dinner, including snacks and desserts.
                                        </p>
                                    </div>
                                    <div>
                                        <div style={{ fontSize: '2.5rem', marginBottom: '1rem' }}>✅</div>
                                        <h3 className="card-title" style={{ fontSize: '1.25rem', marginBottom: '0.5rem' }}>Track Progress</h3>
                                        <p className="small-text" style={{ color: 'var(--text-medium)' }}>
                                            Mark meals as completed and track your ingredient shopping list.
                                        </p>
                                    </div>
                                    <div>
                                        <div style={{ fontSize: '2.5rem', marginBottom: '1rem' }}>🔍</div>
                                        <h3 className="card-title" style={{ fontSize: '1.25rem', marginBottom: '0.5rem' }}>Easy Filtering</h3>
                                        <p className="small-text" style={{ color: 'var(--text-medium)' }}>
                                            Browse meals by category with simple, intuitive filters.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Footer */}
                    <footer>
                        <div className="container">
                            <div className="footer-content">
                                <div className="footer-brand">
                                    <a href="#" className="footer-logo">
                                        🍽️ Daily Meal Planner
                                    </a>
                                    <p className="footer-description">
                                        Your friendly companion for planning healthy meals, managing ingredients, 
                                        and making every day more delicious and nutritious.
                                    </p>
                                    <div className="footer-social">
                                        <a href="#" className="social-link" aria-label="Facebook">
                                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.187 2.686.187v2.953H15.83c-1.491 0-1.956 0.925-1.956 1.914v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 22.927 24 17.992 24 12.073z"/>
                                            </svg>
                                        </a>
                                        <a href="#" className="social-link" aria-label="Instagram">
                                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                                <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.689-.073-4.948-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44 1.44-.645 1.44-1.44-.644-1.44-1.44-1.44z"/>
                                            </svg>
                                        </a>
                                        <a href="#" className="social-link" aria-label="Twitter">
                                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                                <path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557-4.208z"/>
                                            </svg>
                                        </a>
                                    </div>
                                </div>
                                
                                <div>
                                    <h3 className="footer-title">Quick Links</h3>
                                    <ul className="footer-links">
                                        <li><a href="#hero">Home</a></li>
                                        <li><a href="#meals">Browse Meals</a></li>
                                        <li><a href="#ingredients">Shopping List</a></li>
                                        <li><a href="#about">About Us</a></li>
                                    </ul>
                                </div>
                                
                                <div>
                                    <h3 className="footer-title">Categories</h3>
                                    <ul className="footer-links">
                                        <li><a href="#" onClick={() => handleFilterClick('Breakfast')}>Breakfast</a></li>
                                        <li><a href="#" onClick={() => handleFilterClick('Lunch')}>Lunch</a></li>
                                        <li><a href="#" onClick={() => handleFilterClick('Dinner')}>Dinner</a></li>
                                        <li><a href="#" onClick={() => handleFilterClick('Snacks')}>Snacks</a></li>
                                    </ul>
                                </div>
                                
                                <div>
                                    <h3 className="footer-title">Support</h3>
                                    <ul className="footer-links">
                                        <li><a href="#">Help Center</a></li>
                                        <li><a href="#">Privacy Policy</a></li>
                                        <li><a href="#">Terms of Service</a></li>
                                        <li><a href="#">Contact Us</a></li>
                                    </ul>
                                </div>
                            </div>
                            
                            <div className="footer-bottom">
                                <p>© 2026 Daily Meal Planner. Made with Daily AI Website Factory.</p>
                            </div>
                        </div>
                    </footer>

                    {/* Toast Notification */}
                    {toastMessage && (
                        <div className="toast show">
                            <span className="toast-icon">✓</span>
                            <span>{toastMessage}</span>
                        </div>
                    )}

                    <script type="text/babel">
                        // Mobile menu functionality
                        document.addEventListener('DOMContentLoaded', () => {
                            const mobileMenuToggle = document.getElementById('mobileMenuToggle');
                            const navLinks = document.getElementById('navLinks');
                            
                            mobileMenuToggle.addEventListener('click', () => {
                                mobileMenuToggle.classList.toggle('active');
                                navLinks.classList.toggle('active');
                            });
                            
                            // Close mobile menu when clicking on a link
                            navLinks.querySelectorAll('a').forEach(link => {
                                link.addEventListener('click', () => {
                                    mobileMenuToggle.classList.remove('active');
                                    navLinks.classList.remove('active');
                                });
                            });
                            
                            // Smooth scrolling for anchor links
                            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                                anchor.addEventListener('click', function (e) {
                                    e.preventDefault();
                                    const target = document.querySelector(this.getAttribute('href'));
                                    if (target) {
                                        target.scrollIntoView({
                                            behavior: 'smooth',
                                            block: 'start'
                                        });
                                    }
                                });
                            });
                            
                            // Add keyboard navigation support
                            document.addEventListener('keydown', (e) => {
                                if (e.key === 'Escape') {
                                    mobileMenuToggle.classList.remove('active');
                                    navLinks.classList.remove('active');
                                }
                            });
                        });
                    </script>
                </div>
            );
        }

        // Render the app
        ReactDOM.render(<MealPlannerApp />, document.body);
    </script>
</body>
</html>
